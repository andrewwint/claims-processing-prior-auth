[project]
name = "claims-processing-prior-auth"
version = "0.1.0"
description = "Reference implementation for 'Build the Case, Let the Clinician Decide'"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib==2.273.0",
    "aws-cdk.aws-bedrock-agentcore-alpha==2.273.0a0",
    "constructs==10.8.1",
    "boto3==1.43.114",
]

[project.optional-dependencies]
# What the AgentCore Runtime package installs (built for ARM64 by scripts/build_runtime.py).
runtime = [
    "strands-agents==1.61.1",
    "bedrock-agentcore==1.24.1",
    "aws-opentelemetry-distro==0.21.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pycognito==2024.5.1"]
video = [
    "ocrmac==1.0.0",
    "playwright==1.55.0",
]
workbench = [
    "authlib==1.6.5",
    "requests==2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prior_auth"]
